<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>在席管理ボード</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #f0f2f5;
      color: #333; margin: 0; padding: 20px;
      -webkit-tap-highlight-color: transparent;
    }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px; max-width: 1000px; margin: 0 auto;
    }
    .member-card {
      background: #ffffff; border-radius: 14px; padding: 20px 10px;
      text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      cursor: pointer; transition: all 0.2s ease; user-select: none;
      border: 3px solid #ccc;
    }
    .member-card:active { transform: scale(0.95); }
    .member-name { font-size: 1.2em; font-weight: bold; margin-bottom: 8px; color: #2c3e50; }
    .status-label {
      display: inline-block; padding: 4px 12px; border-radius: 20px;
      font-size: 0.9em; font-weight: bold; margin-bottom: 8px; color: white;
    }
    .duration-text { font-size: 0.75em; color: #7f8c8d; height: 1.2em; letter-spacing: -0.5px; }
    .admin-link { display: block; text-align: center; margin-top: 50px; color: #bdc3c7; text-decoration: none; font-weight: bold;}
    #status-modal {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-content {
      background: white; padding: 30px; border-radius: 20px;
      width: 90%; max-width: 450px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: popIn 0.3s ease;
    }
    .presents-text {
      position: fixed; bottom: 10px; right: 15px;
      font-size: 10px; color: #bdc3c7; letter-spacing: 1px;
      user-select: none; z-index: 100;
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title { font-size: 1.3em; font-weight: bold; margin-bottom: 20px; color: #2c3e50; }
    .status-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .status-btn {
      padding: 15px; font-size: 1.1em; font-weight: bold; color: white;
      border: none; border-radius: 12px; cursor: pointer; transition: opacity 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .status-btn:active { opacity: 0.7; transform: translateY(2px); }
    .cancel-btn {
      margin-top: 25px; padding: 15px; width: 100%; background: #ecf0f1;
      color: #34495e; border: none; border-radius: 12px; font-weight: bold;
      font-size: 1.1em; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🏢 在席管理ボード</h1>
  <div class="grid-container" id="board-container"></div>
  <a href="admin.html" class="admin-link">⚙️ 管理画面へ</a>

  <div id="status-modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-title"><span id="modal-user-name"></span> の状況を変更</div>
      <div class="status-btn-grid" id="modal-btn-grid"></div>
      <button class="cancel-btn" onclick="closeModal(event, true)">キャンセル</button>
    </div>
  </div>

  <div class="presents-text">presented by 石川</div>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
